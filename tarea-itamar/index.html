const CONNECTORS_ALL = [

const COMMON_WORDS = new Set('the a an to i and is in of you it my we he she they are am be for on that this with not do does have has at so but or can will your our me us him her them was were'.split(' '));

const STAGE_CONFIGS = [

        body: `
          <div style="font-size: 20px; line-height: 1.6;">
            <ul style="list-style:none; padding:0; margin:10px 0; display:grid; gap:10px;">

              </li>

                📖 <b>Use the guide on the side and the word bank</b>
              </li>
              <li style="background:#0f172a; padding:10px 14px; border-radius:8px;">
                🚫 <b>No Copy/Paste — Write every word yourself</b>

            </ul>
            <p class="he" style="text-align: center; color: #fca5a5; font-size: 19px; font-weight: bold;">רשימות מילים סתמיות או עברית נחסמות אוטומטית. כותבים משפטים שלמים באנגלית.</p>

        }

  },
  {
    id: 'writing1',
    name: '2 · ✍️ Writing 1: Phones',

    title: 'Writing Task 1 · Phones in School 📱 (Opinion)',
    minWords: 80,
    needWords: 5,
    needConn: 3,
    needParas: 3,
    words: [

    connectors: CONNECTORS_ALL,
    checks: [
      { k: 'opinion', label: 'Opinion: "In my opinion / I believe…"', re: '\\b(in my opinion|i think|i believe|i feel|in my view)\\b' },
      { k: 'reason', label: 'Reason: "Because / Since / First of all…"', re: '\\b(because|since|first of all|the reason|reason is)\\b' },
      { k: 'example', label: 'Example: "For example / For instance…"', re: '\\b(for example|for instance|such as)\\b' },
      { k: 'conclusion', label: 'Conclusion: "To sum up / In conclusion / Therefore…"', re: '\\b(to sum up|in conclusion|therefore|all in all)\\b' }
    ],
    prompt: `
      <div>
        <p style="font-size:21px; margin:0 0 6px"><b>📱 Should students be allowed to use phones in school?</b> Write an opinion essay.</p>
        <p class="he" style="font-size:18px; margin:0">כתבו חיבור דעה: האם צריך לאפשר לתלמידים להשתמש בטלפונים בבית הספר? לפחות 80 מילים, 3 פסקאות.</p>
      </div>
    `,
    guide: `
      <div style="background:#0f172a; border:1px solid #334155; border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13px; line-height:1.5">
        <div style="font-weight:bold; color:#fbbf24; margin-bottom:6px">📝 Paragraph Guide & Sentence Starters:</div>
        <div style="margin-bottom:4px"><b>¶ 1 — Opening & Opinion:</b> <i>In my opinion,... / I believe that students should (not) be allowed to use phones in school because...</i></div>
        <div style="margin-bottom:4px"><b>¶ 2 — Reasons & Examples:</b> <i>First of all,... For example,... In addition,... However, some people think that...</i></div>
        <div><b>¶ 3 — Conclusion:</b> <i>To sum up,... Therefore, I believe that...</i></div>
      </div>
    `
  },
  {
    id: 'writing2',
    name: '3 · ✍️ Writing 2: Inspiring Person',
    type: 'writing',
    title: 'Writing Task 2 · An Inspiring Person 🌟',
    minWords: 80,
    needWords: 5,
    needConn: 3,
    needParas: 3,
    words: [
      'inspire', 'support', 'successful', 'improve', 'skill',
      'experience', 'opportunity', 'volunteer', 'community', 'decision',
      'purpose', 'opinion', 'reason', 'proud', 'help'
    ],
    connectors: CONNECTORS_ALL,
    checks: [
      { k: 'person', label: 'Intro & Person: "A person who inspires / In my opinion…"', re: '\\b(a person who|in my opinion|i think|i believe|inspires me)\\b' },
      { k: 'reason', label: 'Reason: "Because / First of all / The reason…"', re: '\\b(because|first of all|the reason|since)\\b' },
      { k: 'example', label: 'Example: "For example / For instance / When…"', re: '\\b(for example|for instance|such as|always)\\b' },
      { k: 'conclusion', label: 'Conclusion: "To sum up / Therefore / In conclusion…"', re: '\\b(to sum up|therefore|in conclusion|all in all)\\b' }
    ],
    prompt: `
      <div>
        <p style="font-size:21px; margin:0 0 6px"><b>🌟 Describe a person who inspires you and explain why.</b></p>
        <p class="he" style="font-size:18px; margin:0">תארו אדם שנותן לכם השראה (בן משפחה, מורה, חבר, או דמות מפורסמת) והסבירו מדוע. לפחות 80 מילים, 3 פסקאות.</p>
      </div>
    `,
    guide: `
      <div style="background:#0f172a; border:1px solid #334155; border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13px; line-height:1.5">
        <div style="font-weight:bold; color:#fbbf24; margin-bottom:6px">📝 Structure & Sentence Starters:</div>
        <div style="margin-bottom:4px"><b>¶ 1 — Who inspires you:</b> <i>A person who inspires me is... In my opinion, this person is special because...</i></div>
        <div style="margin-bottom:4px"><b>¶ 2 — Why & Examples:</b> <i>First of all, he/she always supports... For example,... In addition, he/she taught me to improve my... However, it was not always easy.</i></div>
        <div><b>¶ 3 — Conclusion & Impact:</b> <i>To sum up, this person is a real role model for me. Therefore, I want to learn from his/her experience.</i></div>
      </div>
    `
  },
  { id: 'finish', name: '4 · 📤 סיום ושליחה', type: 'finish' }
];

// ================= STATE MANAGEMENT =================
const STORAGE_KEY = 'itamar_writing_task_state_v1';
let S = {
  stageIdx: 0,
  slideIdx: 0,
  started: false,
  submitted: false,
  startTime: null,
  submitTime: null,
  stageTimes: { 0:0, 1:0, 2:0, 3:0, 4:0 },
  slideAnswers: {}, // { slideIndex: chosenOption }
  w1: { text: '', pastes: 0, blockedCount: 0 },
  w2: { text: '', pastes: 0, blockedCount: 0 },
  exits: [], // [ { start, end, durationSec, reason } ]
  pastes: [], // [ { time, stage, type } ]
  translations: [], // [ { time } ]
  reloads: [], // [ { time } ]
  totalAwaySec: 0
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      S = Object.assign(S, saved);
      S.reloads.push({ time: new Date().toISOString() });
      saveState();
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  } catch(e) {}
}

// ================= EVALUATION ENGINE (FROM server.js) =================
const WRX = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function evalWriting(st, text) {
  const raw = String(text || '').trim();
  const low = ' ' + raw.toLowerCase().replace(/[’']/g, "'") + ' ';
  const has = w => new RegExp('(^|[^a-z])' + WRX(w) + "(s|es|d|ed|ing|ful|ment|ies)?([^a-z]|$)").test(low);
  const toks = (raw.match(/[A-Za-z][A-Za-z'’-]*/g) || []).map(x => x.toLowerCase());

  const reasons = [];
  const hebrew = /[֐-׿]/.test(raw);
  if (hebrew) {
    reasons.push('English only! No Hebrew letters (רק באנגלית)');
  }

  const MASH_RE = /(asdf|sdfg|dfgh|fghj|ghjk|hjkl|qwer|wert|erty|rtyu|tyui|yuio|uiop|zxcv|xcvb|cvbn|vbnm|jkl)/i;
  const junkWords = [];
  const seen = {};
  let consecutiveRepeats = 0;

  for (let i = 0; i < toks.length; i++) {
    const w = toks[i];
    seen[w] = (seen[w] || 0) + 1;
    if (i > 0 && w === toks[i - 1] && !COMMON_WORDS.has(w)) {
      consecutiveRepeats++;
    }
    const isMash = MASH_RE.test(w);
    const noVowels = !/[aeiouy]/.test(w) && w.length >= 2;
    const tripleChar = /(.)\1\1/.test(w);
    const badLen = w.length > 18 || (w.length === 1 && w !== 'i' && w !== 'a');
    if (isMash || noVowels || tripleChar || badLen) {
      if (!junkWords.includes(w)) junkWords.push(w);
    }
  }

  if (junkWords.length > 0) {
    reasons.push('Remove gibberish / nonsense letters: "' + junkWords.slice(0, 3).join('", "') + '"');
  }

  if (consecutiveRepeats > 0) {
    reasons.push('Do not repeat the exact same word side-by-side');
  }

  for (const [w, count] of Object.entries(seen)) {
    if (!COMMON_WORDS.has(w)) {
      if (toks.length <= 10 && count >= 2 && (count / toks.length) >= 0.4) {
        reasons.push(`Too many repetitions of "${w}"`);
        break;
      } else if (toks.length > 10 && ((count >= 5 && (count / toks.length) > 0.15) || count > 12)) {
        reasons.push(`Too many repetitions of "${w}"`);
        break;
      }
    }
  }

  const vocabWords = (st.words || []).filter(has);
  const connWords = (st.connectors || []).filter(has);
  const bankAndConn = new Set((st.words || []).concat(st.connectors || []).flatMap(x => x.split(' ')));
  let run = 0, maxRun = 0, listWordCount = 0;
  for (const w of toks) {
    if (bankAndConn.has(w) && !COMMON_WORDS.has(w)) {
      listWordCount++;
      run++;
      maxRun = Math.max(maxRun, run);
    } else {
      run = 0;
    }
  }
  const isListDump = toks.length > 3 && (maxRun >= 3 || (listWordCount / toks.length > 0.6 && toks.length > 5));
  if (isListDump) {
    reasons.push('Do not just list connectors or vocabulary words — write complete sentences');
  }

  const blocked = reasons.length > 0;
  const realWords = toks.filter(w => !junkWords.includes(w)).length;
  const words = blocked ? 0 : realWords;
  const vocab = blocked ? [] : vocabWords;
  const conn = blocked ? [] : connWords;
  const paras = blocked ? 0 : raw.split(/\n\s*\n|\n/).filter(x => (x.match(/[A-Za-z]+/g) || []).length >= 6).length;

  const checks = {
    len: !blocked && words >= (st.minWords || 80),
    vocab: !blocked && vocab.length >= (st.needWords || 5),
    conn: !blocked && conn.length >= (st.needConn || 3),
    paras: !blocked && paras >= (st.needParas || 3),
    real: !blocked
  };

  (st.checks || []).forEach(c => {
    checks[c.k] = !blocked && new RegExp(c.re, 'i').test(low);
  });

  let pts = 0;
  if (!blocked) {
    pts = Math.min(words, 180) * 3 + vocab.length * 40 + conn.length * 40 + Object.values(checks).filter(Boolean).length * 80;
    pts = Math.min(pts, 2000);
  }

  return {
    words: realWords,
    junk: junkWords.length,
    vocab: vocabWords,
    conn: connWords,
    paras,
    checks,
    hebrew,
    blocked,
    reasons,
    pts
  };
}

// ================= INTEGRITY & MONITORING =================
let isAway = false;
let awayStart = null;
const overlayReturn = document.getElementById('overlay-return');
const overlayEsc = document.getElementById('overlay-esc');

async function enterFullscreenLock() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    }
  } catch(e) {}
  try {
    if (navigator.keyboard && navigator.keyboard.lock) {
      await navigator.keyboard.lock(['Escape', 'MetaLeft', 'MetaRight', 'AltLeft', 'Tab', 'F11']);
    }
  } catch(e) {}
}

function handleAway(reason) {
  if (!S.started || S.submitted || isAway) return;
  isAway = true;
  awayStart = Date.now();
  S.exits.push({
    start: new Date().toISOString(),
    end: null,
    durationSec: 0,
    reason: reason
  });
  saveState();
  overlayReturn.classList.add('active');
  updateTopBar();
}

function handleReturn() {
  if (!isAway) return;
  const now = Date.now();
  const durSec = awayStart ? Math.round((now - awayStart) / 1000) : 0;
  isAway = false;
  awayStart = null;
  S.totalAwaySec += durSec;
  if (S.exits.length > 0) {
    const last = S.exits[S.exits.length - 1];
    last.end = new Date().toISOString();
    last.durationSec = durSec;
  }
  saveState();
  overlayReturn.classList.remove('active');
  updateTopBar();
}

document.getElementById('btn-return').onclick = async () => {
  await enterFullscreenLock();
  handleReturn();
};

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && S.started && !S.submitted) {
    handleAway('fullscreen_exit');
  } else if (document.fullscreenElement && isAway) {
    handleReturn();
  }
});

window.addEventListener('blur', () => {
  if (S.started && !S.submitted) handleAway('window_blur');
});

window.addEventListener('focus', () => {
  if (isAway && document.fullscreenElement) handleReturn();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.started && !S.submitted) {
    handleAway('tab_hidden');
  } else if (!document.hidden && isAway && document.fullscreenElement) {
    handleReturn();
  }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.started && !S.submitted) {
    overlayEsc.classList.add('active');
    e.preventDefault();
  }
}, true);

window.addEventListener('keyup', e => {
  if (e.key === 'Escape') overlayEsc.classList.remove('active');
}, true);

// Google Translate detection
let lastTranslated = false;
function checkGoogleTranslate() {
  const doc = document.documentElement;
  const isTr = /translated-(ltr|rtl)/.test(doc.className) ||
               doc.lang !== 'en' ||
               !!document.querySelector('font[style*="vertical-align"]') ||
               !!document.querySelector('.goog-te-banner-frame, #goog-gt-tt');
  if (isTr !== lastTranslated) {
    lastTranslated = isTr;
    if (isTr && S.started && !S.submitted) {
      S.translations.push({ time: new Date().toISOString() });
      saveState();
      updateTopBar();
    }
  }
}
new MutationObserver(checkGoogleTranslate).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'lang'] });
setInterval(checkGoogleTranslate, 1000);

// Timer ticking
setInterval(() => {
  if (S.started && !S.submitted && !isAway) {
    S.stageTimes[S.stageIdx] = (S.stageTimes[S.stageIdx] || 0) + 1;
    saveState();

}, 1000);

}

function fmtSec(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}m ${s < 10 ? '0' : ''}${s}s`;
}

// SHA-256 (Pure Web Crypto with zero dependencies)
async function computeSha256(str) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

  const cfgW2 = STAGE_CONFIGS[3];
  const ev1 = evalWriting(cfgW1, S.w1.text);
  const ev2 = evalWriting(cfgW2, S.w2.text);

  const w1Ok = ev1.words >= cfgW1.minWords && ev1.paras >= cfgW1.needParas && !ev1.blocked;
  const w2Ok = ev2.words >= cfgW2.minWords && ev2.paras >= cfgW2.needParas && !ev2.blocked;

  const { report, hash } = await buildSubmissionReport();
  const waUrl = `https://wa.me/56972152259?text=${encodeURIComponent(report)}`;
  const mailUrl = `mailto:alanbendov@gmail.com?subject=${encodeURIComponent('TAREA ITAMAR YOCHANAN 23-NOV')}&body=${encodeURIComponent(report)}`;

  if (S.submitted) {
    app.innerHTML = `
      ${renderHeader()}
      <div class="card" style="text-align:center; padding:36px 20px">
        <div style="font-size:72px">🎉</div>
        <div style="color:#4ade80; font-size:36px; font-weight:900; margin:10px 0" class="he">התשובות נשלחו! תודה רבה!</div>
        <p class="he" style="font-size:22px; color:#cbd5e1; max-width:750px; margin:14px auto; line-height:1.7">
          נפתח וואטסאפ עם התשובות — רק ללחוץ "שלח". אל תשנה את הטקסט.<br>
          כל הנתונים, הטקסטים וקוד הבדיקה (CHK) נשמרו.
        </p>

        <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin:24px 0">
          <a href="${waUrl}" target="_blank" style="text-decoration:none">
            <button class="btn-green" style="font-size:20px; padding:14px 28px">
              💬 פתח וואטסאפ שוב
            </button>
          </a>
          <button id="btn-copy-rep" class="btn-amber" style="font-size:20px; padding:14px 28px">
            📋 העתק דוח ללוח
          </button>
          <a href="${mailUrl}" style="text-decoration:none">
            <button class="btn-gray" style="font-size:20px; padding:14px 28px">
              ✉️ שלח באימייל גיבוי
            </button>
          </a>
        </div>

        <div style="text-align:left; margin-top:24px">
          <label style="font-weight:bold; color:#94a3b8; font-size:14px">טקסט הדוח המלא והמאומת (CHK: ${hash.slice(0, 10)}...):</label>
          <textarea readonly style="font-family:monospace; font-size:13px; min-height:260px; margin-top:6px">${esc(report)}</textarea>
        </div>
      </div>
    `;

    document.getElementById('btn-copy-rep').onclick = () => {
      navigator.clipboard.writeText(report).then(() => {
        alert('הדוח הועתק ללוח בהצלחה!');
      });
    };
    return;
  }

  app.innerHTML = `
    ${renderHeader()}
    <div class="card">
      <h2 style="margin-top:0">📤 סיום ושליחת המשימה</h2>
      <div style="font-size:18px; color:#cbd5e1; margin-bottom:18px">בדוק את סיכום המשימות לפני השליחה הסופית:</div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:14px 0">
        <div style="background:#0f172a; border-radius:12px; padding:16px; border:1px solid #334155">
          <h3 style="margin:0 0 10px; color:#fbbf24; font-size:20px">📱 Writing 1: Phones in School</h3>
          <div>מילים: <b>${ev1.words}</b> / ${cfgW1.minWords} ${ev1.words >= cfgW1.minWords ? '✅' : '⚠️'}</div>
          <div>פסקאות: <b>${ev1.paras}</b> / ${cfgW1.needParas} ${ev1.paras >= cfgW1.needParas ? '✅' : '⚠️'}</div>
          <div>ניקוד: <b>${ev1.pts}</b> pts</div>
          ${ev1.blocked ? '<div style="color:#f87171; font-weight:bold; margin-top:6px">🚫 טקסט חסום (יש לתקן)</div>' : ''}
          <button class="btn-gray" style="margin-top:12px; font-size:15px; padding:8px 16px" onclick="goToStage(2)">
            ✏️ ערוך משימה 1
          </button>
        </div>

        <div style="background:#0f172a; border-radius:12px; padding:16px; border:1px solid #334155">
          <h3 style="margin:0 0 10px; color:#fbbf24; font-size:20px">🌟 Writing 2: Inspiring Person</h3>
          <div>מילים: <b>${ev2.words}</b> / ${cfgW2.minWords} ${ev2.words >= cfgW2.minWords ? '✅' : '⚠️'}</div>
          <div>פסקאות: <b>${ev2.paras}</b> / ${cfgW2.needParas} ${ev2.paras >= cfgW2.needParas ? '✅' : '⚠️'}</div>
          <div>ניקוד: <b>${ev2.pts}</b> pts</div>
          ${ev2.blocked ? '<div style="color:#f87171; font-weight:bold; margin-top:6px">🚫 טקסט חסום (יש לתקן)</div>' : ''}
          <button class="btn-gray" style="margin-top:12px; font-size:15px; padding:8px 16px" onclick="goToStage(3)">
            ✏️ ערוך משימה 2
          </button>
        </div>
      </div>

      ${(!w1Ok || !w2Ok) ? `
        <div class="he" style="background:#78350f; color:#fef3c7; border:1px solid #f59e0b; border-radius:10px; padding:14px; margin:16px 0; font-size:17px">
          ⚠️ <b>שים לב:</b> אחד החיבורים עדיין לא עומד בכל הדרישות (פחות מ-80 מילים, חסרות פסקאות או שיש חסימת שפה). מומלץ לחזור ולתקן לפני השליחה!
        </div>
      ` : ''}

      <button id="btn-submit" class="btn-go" style="margin-top:14px; font-size:26px; padding:20px">
        📤 שליחת התשובות / Send answers
      </button>
    </div>
  `;

  document.getElementById('btn-submit').onclick = async () => {
    if (!confirm('האם אתה בטוח שברצונך לשלוח את התשובות למורה מרדכי? לאחר השליחה המשימה תסתיים.')) return;
    S.submitted = true;
    S.submitTime = new Date().toISOString();
    saveState();

    const sub = await buildSubmissionReport();
    const finalWa = `https://wa.me/56972152259?text=${encodeURIComponent(sub.report)}`;
    window.open(finalWa, '_blank');
    render();
  };
}

function render() {
  if (S.stageIdx === 0) renderInstructions();
  else if (S.stageIdx === 1) renderSlides();
  else if (S.stageIdx === 2) renderWriting(2);
  else if (S.stageIdx === 3) renderWriting(3);
  else if (S.stageIdx === 4) renderFinish();
}

// Initial bootstrap
loadState();
render();
</script>
</body>
