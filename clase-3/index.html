    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#eaf8ff,#fff8df);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}
    button{font:inherit}.slide{position:absolute;inset:0 0 var(--bar);padding:18px 42px 14px;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateX(18px);transition:.2s ease}.slide.on{opacity:1;pointer-events:auto;transform:none}.in{width:min(1196px,100%);height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:9px;align-content:center}.top{display:flex;align-items:center;gap:12px}.tag{font-size:13px;letter-spacing:.14em;font-weight:800;color:var(--red)}.page{margin-left:auto;background:var(--navy);color:white;padding:5px 10px;border-radius:999px;font-weight:800}.title{font-size:clamp(28px,3.6vw,50px);line-height:1.02;margin:0;color:var(--navy)}
    .instruction{display:flex;align-items:center;gap:12px;background:#ffffffd9;border:1px solid var(--line);border-left:8px solid var(--gold);border-radius:14px;padding:8px 12px}.he{direction:rtl;text-align:right;font-size:clamp(18px,1.8vw,25px);font-weight:800;line-height:1.2;flex:1}.voice,.btn,.audio-btn{border:0;border-radius:10px;background:var(--navy);color:white;padding:9px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #071a2b}.voice:hover,.btn:hover,.audio-btn:hover{background:#245479}.voice:active,.btn:active,.audio-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #071a2b}.stage{min-height:0;display:grid;align-content:center;gap:10px}.hero{height:100%;min-height:0;border-radius:22px;overflow:hidden;position:relative;background:#123 url('img/kite-festival-1.jpg') center/cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#081b2ad9 0 47%,transparent 78%)}.hero-copy{position:absolute;z-index:1;left:4%;top:50%;transform:translateY(-50%);width:52%;color:white}.hero-copy h2{font-size:clamp(36px,5.5vw,76px);line-height:.92;margin:0 0 14px}.hero-copy p{font-size:clamp(20px,2vw,30px);font-weight:800;margin:0}.stamp{display:inline-block;background:var(--red);padding:7px 12px;border-radius:8px;margin-bottom:15px;font-weight:900;letter-spacing:.08em}
    .three,.grid2,.grid4{display:grid;gap:12px}.three{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 5px 16px #16324f16}.method{text-align:center;border-top:8px solid var(--red)}.method b{font-size:clamp(25px,2.6vw,38px);display:block}.method span{font-size:clamp(17px,1.5vw,22px)}.num{display:inline-grid!important;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--navy);color:white;margin:0 auto 10px}
    .video{width:min(900px,100%);height:min(50vh,475px);margin:auto;aspect-ratio:16/9;background:#08141f;border:5px solid var(--navy);border-radius:16px;overflow:hidden}.video iframe,.video video{width:100%;height:100%;border:0}.under{text-align:center;color:var(--muted);font-size:13px}.under button{background:none;border:0;color:var(--navy);font-weight:800;text-decoration:underline;cursor:pointer}.prompt{font-size:clamp(21px,2vw,29px);font-weight:800}.choice{display:block;padding:5px 0}.rev{display:grid;gap:7px}.rev-controls{display:flex;gap:8px}.answer{display:none;background:#e8f7ef;border-left:7px solid var(--green);border-radius:10px;padding:9px 12px;color:#07583f;font-size:clamp(17px,1.5vw,22px);font-weight:800}.answer.hint{background:#fff4cf;border-left-color:var(--gold);color:#714d00}.answer.show{display:block}.mark{border-radius:5px;transition:.2s}.mark.lit{background:#fff09a;box-shadow:0 0 0 3px #fff09a;color:#102a43}
    .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:min(47vh,370px)}figure{margin:0;min-height:0;position:relative;overflow:hidden;border-radius:15px;background:#123}figure img{width:100%;height:100%;object-fit:cover}figcaption{position:absolute;inset:auto 8px 8px;background:#0b2238dc;color:white;padding:5px 8px;border-radius:7px;font-size:12px}.vocab{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.word{background:var(--paper);border:1px solid var(--line);border-top:7px solid var(--gold);border-radius:12px;padding:12px;text-align:center;font-size:clamp(19px,1.8vw,27px);font-weight:900}.word small{display:block;color:var(--muted);font-size:14px;margin-top:3px}.word .answer{font-size:20px;margin-top:8px;border:0;padding:6px}
    .paper{background:#fff;border:1px solid #b8c4cc;border-radius:14px;padding:15px 22px;box-shadow:0 7px 18px #16324f1b;font:clamp(17px,1.45vw,22px)/1.43 Georgia,serif}.paper p{margin:0}.roman{font-weight:900;color:var(--red);font-family:Arial,sans-serif;margin-right:7px}.ln{display:inline-block;color:#73899b;font:700 13px Arial,sans-serif;width:24px;margin-left:-24px}.paper-actions{display:flex;gap:10px;margin-top:10px}.summary{display:none;direction:rtl;text-align:right;background:#e8f7ef;border-radius:10px;padding:8px 12px;font:bold clamp(17px,1.45vw,21px) Arial,sans-serif}.summary.show{display:block}.q-layout{display:grid;grid-template-columns:1.13fr .87fr;gap:12px;align-items:start}.questions{display:grid;gap:8px}.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:clamp(16px,1.35vw,20px);line-height:1.26}.q b{font-size:1.08em}.ref{color:var(--red);font-weight:900}.pts{float:right;color:var(--muted);font-size:13px}
    .paragraph-slide .paper{font-size:26px}.question-slide .paper{font-size:21px}.question-slide .q{font-size:19px}
    .big-task{background:var(--navy);color:white;border-radius:18px;padding:20px;text-align:center}.big-task h2{font-size:clamp(30px,3.6vw,50px);margin:0 0 8px}.big-task p{font-size:clamp(20px,2vw,29px);margin:0}.count{color:var(--gold);font-weight:900}.quizline{font-size:clamp(23px,2.5vw,36px);text-align:center}.wrong{color:#b42318;text-decoration:line-through}.right{color:var(--green);font-weight:900}.structure{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.structure div{background:var(--paper);border-radius:13px;border-top:8px solid var(--red);padding:13px;text-align:center;font-size:clamp(17px,1.5vw,22px)}.structure b{display:block;color:var(--navy);font-size:1.1em;margin-bottom:5px}.writebox{border:3px dashed var(--navy);border-radius:17px;padding:18px;background:#ffffffb8;font-size:clamp(20px,2vw,29px);line-height:1.55}.exit{counter-reset:item;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.exit .card{font-size:clamp(20px,1.9vw,28px);font-weight:800}.exit .card:before{counter-increment:item;content:counter(item);display:grid;place-items:center;width:40px;height:40px;background:var(--red);color:white;border-radius:50%;margin-bottom:9px}.score{text-align:center;background:var(--navy);color:white;border-radius:18px;padding:18px;font-size:clamp(30px,4vw,56px);font-weight:900}.credit{font-size:12px;color:var(--muted);text-align:center}
    #progress{position:fixed;z-index:9;top:0;left:0;height:5px;background:var(--red);transition:.2s}#bar{position:fixed;bottom:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;gap:11px;padding:8px 4vw;background:#f9fcfded;border-top:1px solid var(--line);backdrop-filter:blur(8px)}.round{width:43px;height:43px;border:2px solid var(--navy);border-radius:50%;background:white;color:var(--navy);font-size:21px;font-weight:900;cursor:pointer}#count{font-weight:900;color:var(--muted)}#timer{margin-left:auto;font-size:25px;font-weight:900;color:var(--navy);cursor:pointer;min-width:72px;text-align:right}.kbd{font-size:12px;color:var(--muted)}
    @media(max-width:850px){.slide{padding:14px 18px}.three,.grid4,.vocab,.structure,.exit{grid-template-columns:repeat(2,1fr)}.q-layout{grid-template-columns:1fr}.photos{height:35vh}.paper{font-size:16px}.kbd{display:none}}
    @media(max-height:650px){.instruction{padding:5px 10px}.title{font-size:31px}.slide{padding-top:10px}.paper{font-size:16px;line-height:1.28}.answer{padding:6px 10px}.photos{height:36vh}.video{height:42vh}}

<body>
<div id="progress"></div><main id="deck"></main>
<nav id="bar" aria-label="Presentation controls"><button class="round" id="prev" aria-label="Previous">←</button><button class="round" id="next" aria-label="Next">→</button><span id="count"></span><span class="kbd">Space: reveal · T: timer · F: full screen</span><span id="timer" title="Pause or restart timer">—</span><button class="round" id="full" aria-label="Full screen">⛶</button></nav>
<script>
const S=[];
const add=(title,he,body,seconds,page='')=>S.push({title,he,body,seconds,page,a:'s'+String(S.length+1).padStart(2,'0')});
const R=items=>`<div class="rev"><div class="rev-controls"><button class="btn" onclick="one(this.closest('.rev'))">Show answer</button><button class="btn" onclick="allAnswers(this.closest('.rev'))">Show all</button></div>${items.map(x=>`<div class="answer ${x.hint?'hint':''}" data-mark="${x.mark||''}">${x.hint?'💡 Hint':'✓ Answer'}: ${x.text}</div>`).join('')}</div>`;
const vocab=(en,clue,he)=>`<div class="word">${en}<small>${clue}</small><button class="btn" onclick="one(this.parentElement)">עברית</button><div class="answer">${he}</div></div>`;
const P1=`<div class="paper"><p><span class="roman">I</span> In many places in the world, the weather is lovely in the spring. <span class="mark q1">The days are dry and warm. This is the perfect weather to fly* a kite.</span> In some countries, there are kite festivals in the spring. <span class="ln">5</span><span class="mark q2">Some of the largest kite festivals are in China.</span></p></div>`;
const P2=`<div class="paper"><p><span class="roman">II</span> People in China made the first kites thousands of years ago. <span class="mark q4">Those kites were small and looked like* birds.</span> Today, the kites in China are very large, and many of them have interesting shapes. For example, some of them look like animals or buildings. <span class="ln">10</span><span class="mark q3">At the kite festivals, the most beautiful and the most unusual kites win prizes.</span></p></div>`;
const P3=`<div class="paper"><p><span class="roman">III</span> Last year, 100,000 people went to an international kite festival in China. <span class="mark q5">They came from 60 different countries.</span> Bob Grant was one of these visitors. He traveled to China with a group of friends.</p></div>`;
const P4=`<div class="paper"><p><span class="roman">IV</span> “This festival was wonderful,” said Bob. “<span class="mark q6">There were hundreds of kites in the sky. It was amazing to see that.</span> I bought a beautiful kite while I was there. <span class="ln">15</span><span class="mark q7">I hope to fly it next year at another kite festival in China.</span>”</p></div>`;
const para=(n,text,summary)=>`${text}<div class="paper-actions"><button class="audio-btn" onclick="playClip('p${n}-en')">🔊 Read in English</button><button class="audio-btn" onclick="heSummary(this,'p${n}-he')">🔊 סיכום בעברית</button></div><div class="summary">${summary}</div>`;
const VIDEO=`<div class="video" id="videoBox"><iframe src="https://www.youtube-nocookie.com/embed/oQF78h1MT88?start=0&end=150&rel=0&modestbranding=1" title="Weifang Kite Festival, first 2 minutes 30 seconds" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div class="under">Watch 0:00–2:30 · <button onclick="useBackup()">Use offline MP4</button> · The China Traveller / YouTube</div>`;

add('Today: a real Bagrut text','היום עובדים על טקסט אמיתי מבגרות. המטרה: למצוא תשובות מהר ובדיוק.',`<div class="hero"><div class="hero-copy"><span class="stamp">REAL BAGRUT · 100 POINTS</span><h2>KITE FESTIVALS<br>IN CHINA</h2><p>Printed pages 4–6 · Questions 1–7</p></div></div>`,120,'0–2');
add('The 3-step method','עובדים תמיד בשלושה צעדים: קודם שאלות, אחר כך רפרוף, ובסוף סריקה לתשובה.',`<div class="three"><div class="card method"><b class="num">1</b><b>Questions first</b><span>Circle the key words.</span></div><div class="card method"><b class="num">2</b><b>Read quickly</b><span>Understand the main idea.</span></div><div class="card method"><b class="num">3</b><b>Scan</b><span>Find the exact line.</span></div></div>`,180,'2–5');
add('Before reading · watch','צופים בשתי דקות וחצי הראשונות. בזמן הצפייה חפשו: מקום, צורות ומספר אנשים.',VIDEO,180,'5–8');
add('What did you notice?','עונים בעל־פה באנגלית. חושפים רמז או תשובה רק אחרי שניסינו.',`<div class="grid2"><div class="card prompt">1. Where is the festival?</div><div class="card prompt">2. What shapes can you see?</div><div class="card prompt">3. Is it a small event or a large event?</div><div>${R([{hint:true,text:'Listen for the city and country.'},{text:'It is in Weifang, China.'},{hint:true,text:'Look up at the sky.'},{text:'Animals, characters, long dragons and other shapes.'},{hint:true,text:'Look at the crowd.'},{text:'It is a large international event.'}])}</div></div>`,420,'8–15');
add('Vocabulary · see it','מסתכלים בתמונות ואומרים את המילים באנגלית. אחר כך חושפים את העברית.',`<div class="photos"><figure><img src="img/kite-festival-1.jpg" alt="Many kites in a blue sky"><figcaption>many kites · sky</figcaption></figure><figure><img src="img/kite-festival-2.jpg" alt="Kites with unusual shapes"><figcaption>unusual shapes · fly</figcaption></figure><figure><img src="img/kite-festival-3.jpg" alt="Visitors at a large kite festival"><figcaption>festival · visitors</figcaption></figure></div><div class="credit">Photos: Sprt98, Weifang International Kite Festival, CC BY-SA 4.0 · Wikimedia Commons</div>`,300,'15–20');
add('Vocabulary · reveal','אומרים כל מילה בקול. נסו לנחש מן הרמז לפני שחושפים את התרגום.',`<div class="vocab">${vocab('weather','dry and warm','מזג אוויר')}${vocab('kite','fly it in the sky','עפיפון')}${vocab('festival','a special public event','פסטיבל / חגיגה')}${vocab('shape','animal or building','צורה')}${vocab('unusual','not usual','יוצא דופן')}${vocab('prize','you win it','פרס')}${vocab('international','many countries','בינלאומי')}${vocab('visitor','a person who comes','מבקר')}${vocab('hundreds','100s','מאות')}${vocab('wonderful','very good','נפלא') }</div>`,300,'20–25');
add('Open your Bagrut','פותחים עכשיו את חוברת הבגרות בעמוד המודפס 4. קוראים רק את הכותרת ואת השאלות 1–2.',`<div class="big-task"><h2>Open page 4</h2><p><b>Text 1:</b> KITE FESTIVALS IN CHINA</p><p>Then look at <b>page 5 · questions 1–2</b>.</p></div><div class="card prompt">Do not read every word yet. Circle: <b>paragraph I · spring · country</b></div>`,60,'25–26');
add('Paragraph I · lines 1–5','קוראים יחד. לחצו על הקריאה באנגלית, ואז על הסיכום בעברית.',para(1,P1,'באביב מזג האוויר יבש וחמים, ולכן הוא מתאים להעפת עפיפונים. כמה מפסטיבלי העפיפונים הגדולים ביותר נמצאים בסין.'),180,'26–29');
add('Page 5 · questions 1–2','מחפשים את התשובה בשורות 1–5. קודם רמז, אחר כך תשובה והדגשה בטקסט.',`<div class="q-layout"><div>${P1}</div><div class="questions"><div class="q"><span class="pts">7 points</span><b>1. What do we learn from paragraph I?</b><span class="choice">i) Why some people like to fly kites.</span><span class="choice">ii) Why spring is a good time to fly kites.</span><span class="choice">iii) Why countries have large kite festivals.</span></div><div class="q"><span class="pts">6 points</span><b>2. Which country has some of the largest kite festivals?</b> (paragraph I)</div>${R([{hint:true,text:'Q1: Find the weather in lines 1–3.'},{mark:'q1',text:'Q1: ii) Why spring is a good time to fly kites.'},{hint:true,text:'Q2: Scan lines 4–5 for a country.'},{mark:'q2',text:'Q2: China.'}])}</div></div>`,300,'29–34');
add('Paragraph II · lines 6–10','קוראים יחד. מחפשים בעבר ובהווה: איך נראו העפיפונים הראשונים, ואילו עפיפונים זוכים.',para(2,P2,'העפיפונים הראשונים בסין היו קטנים ונראו כמו ציפורים. היום יש עפיפונים גדולים בצורות מעניינות, והיפים והמיוחדים ביותר זוכים בפרסים.'),240,'34–38');
add('Page 5 · questions 3–4','מחפשים את התשובות בשורות 6–10. מצביעים על המשפט המדויק לפני שחושפים.',`<div class="q-layout"><div>${P2}</div><div class="questions"><div class="q"><span class="pts">6 points</span><b>3. What do we learn from paragraph II?</b><span class="choice">i) When kite festivals began.</span><span class="choice">ii) Why the kites in China are large.</span><span class="choice">iii) Which kites get prizes at the festivals.</span></div><div class="q"><span class="pts">6 points</span><b>4. What did the first kites in China look like?</b> (paragraph II)</div>${R([{hint:true,text:'Q3: Scan lines 9–10 for “win”.'},{mark:'q3',text:'Q3: iii) Which kites get prizes at the festivals.'},{hint:true,text:'Q4: Find “looked like” in lines 6–8.'},{mark:'q4',text:'Q4: They looked like birds.'}])}</div></div>`,360,'38–44');
add('Paragraph III · lines 11–13','קוראים יחד. מחפשים מספרים: כמה אנשים הגיעו ומכמה מדינות.',para(3,P3,'בשנה שעברה הגיעו לפסטיבל בינלאומי בסין מאה אלף אנשים משישים מדינות. בוב גרנט הגיע עם חברים.'),180,'44–47');
add('Page 5 · question 5','סורקים את שורות 11–13. השאלה היא מאיפה הגיעו האנשים, לא כמה אנשים הגיעו.',`<div class="q-layout"><div>${P3}</div><div class="questions"><div class="q"><span class="pts">7 points</span><b>5. Where did people at the international kite festival come from?</b> (paragraph III)</div>${R([{hint:true,text:'Find “They came from …” in lines 11–12.'},{mark:'q5',text:'They came from 60 different countries.'}])}</div></div>`,180,'47–50');
add('Paragraph IV · lines 14–16','קוראים יחד. מחפשים מה היה מדהים ומה בוב מקווה לעשות בשנה הבאה.',para(4,P4,'בוב ראה מאות עפיפונים בשמיים וקנה עפיפון יפה. הוא מקווה להעיף אותו בפסטיבל אחר בסין בשנה הבאה.'),180,'50–53');
add('Page 6 · questions 6–7','פותחים עמוד 6. עונים מן המשפט המדויק בשורות 14–16.',`<div class="q-layout"><div>${P4}</div><div class="questions"><div class="q"><span class="pts">7 points</span><b>6. According to Bob, what was amazing to see at the festival?</b> (paragraph IV)</div><div class="q"><span class="pts">7 points</span><b>7. What do we learn about Bob from paragraph IV?</b><span class="choice">i) He wants to buy a beautiful kite next year.</span><span class="choice">ii) He wants to live in China for a year.</span><span class="choice">iii) He wants to go to another kite festival next year.</span></div>${R([{hint:true,text:'Q6: Find “amazing to see”.'},{mark:'q6',text:'Hundreds of kites in the sky.'},{hint:true,text:'Q7: Find “I hope … next year”.'},{mark:'q7',text:'iii) He wants to go to another kite festival next year.'}])}</div></div>`,120,'53–55');
add('Writing · 70–90 words','כותבים על חג שאתם חוגגים. בוחרים סוכות, פסח או חג אחר. המטרה היא 70–90 מילים.',`<div class="big-task"><h2>Describe a holiday or festival you celebrate.</h2><p>Write what it is, what you do, and why you like it.</p><p class="count">70–90 words</p></div><div class="grid2"><div class="card prompt">You may choose: <b>Sukkot · Pesach · Purim · another holiday</b></div><div class="card prompt">Use: <b>First · Also · Because · In conclusion</b></div></div>`,120,'55–57');
add('Right or wrong? · expressions','מחליטים מה נכון. מתקנים את המשפטים הלא נכונים ואז חושפים.',`<div class="grid2"><div class="card quizline">I want to write <b>on</b> Pesach.</div><div class="card quizline"><b>At</b> my opinion, it is exciting.</div></div>${R([{text:'I want to write <span class="right">about</span> Pesach.'},{text:'<span class="right">In my opinion</span>, it is exciting.'}])}`,180,'57–60');
add('Right or wrong? · time and feeling','מחליטים מה נכון: ביטוי זמן, ואיך מתארים הרגשה לעומת דבר.',`<div class="grid2"><div class="card quizline">Two years <b>before</b>, we traveled.</div><div class="card quizline">We were very <b>exciting</b>.</div></div>${R([{text:'<span class="right">Two years ago</span>, we traveled.'},{text:'We were very <span class="right">excited</span>. The trip was <span class="right">exciting</span>.'}])}`,180,'60–63');
add('There is · there are · there was · there were','משלימים לפי יחיד או רבים ולפי הווה או עבר.',`<div class="grid4"><div class="card quizline">Now: ___ one meal.</div><div class="card quizline">Now: ___ many guests.</div><div class="card quizline">Last year: ___ one trip.</div><div class="card quizline">Last year: ___ many visitors.</div></div>${R([{text:'There <span class="right">is</span> one meal.'},{text:'There <span class="right">are</span> many guests.'},{text:'There <span class="right">was</span> one trip.'},{text:'There <span class="right">were</span> many visitors.'}])}`,180,'63–66');
add('Useful opinion sentences','בוחרים משפט פתיחה אחד. לא משתמשים בכולם.',`<div class="three"><div class="card quizline">In my opinion, …</div><div class="card quizline">I think that …</div><div class="card quizline">Let me tell you what I think about …</div></div><div class="card prompt">Example: <b>In my opinion, Sukkot is special because my family eats together.</b></div>`,120,'66–68');
add('Build one paragraph','מתכננים ארבעה חלקים קצרים. כל חלק צריך לענות על שאלה אחרת.',`<div class="structure"><div><b>1 · Topic</b>The holiday I celebrate is …</div><div><b>2 · What happens?</b>First, we …<br>Also, we …</div><div><b>3 · Your view</b>I like it because …</div><div><b>4 · Ending</b>In conclusion, …</div></div><div class="card prompt">Check: capital letters · full stops · 70–90 words</div>`,120,'68–70');
add('Write now · 2-minute sprint','כותבים עכשיו ברצף. לא מוחקים כל משפט. אם נתקעים, ממשיכים בעזרת משפט הפתיחה הבא.',`<div class="writebox"><b>The holiday I celebrate is __________.</b><br>First, my family and I __________. Also, we __________.<br>In my opinion, this holiday is __________ because __________.<br>In conclusion, __________.</div>`,120,'70–72');
add('Exit ticket · write 3 answers','עונים בקצרה על שלוש שאלות בדף העזר. כל תשובה נכונה נותנת נקודות.',`<div class="exit"><div class="card">Which country has some of the largest kite festivals?</div><div class="card">Complete: We were very ________. The festival was ________.</div><div class="card">Write one useful opinion starter.</div></div>`,300,'72–77');
add('Check · score /10','בודקים את שלוש התשובות, מחשבים ציון מתוך עשר ומוסרים את דף העזר.',`<div class="grid2"><div>${R([{text:'1. China. <b>(3 points)</b>'},{text:'2. excited · exciting. <b>(4 points)</b>'},{text:'3. In my opinion, … / I think that … <b>(3 points)</b>'}])}</div><div class="score">ציון ___ / 10</div></div>`,180,'77–80');

const deck=document.querySelector('#deck'),audio=new Audio();
S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(s.title.startsWith('Paragraph')?' paragraph-slide':s.title.startsWith('Page ')?' question-slide':'');el.innerHTML=`<div class="in"><div class="top"><div class="tag">ENGLISH · י״א · REAL BAGRUT · 19 OCT 2026</div><div class="page">${s.page} min</div></div><h1 class="title">${s.title}</h1><div class="stage"><div class="instruction"><div class="he">${s.he}</div><button class="voice" onclick="voice(${i})">🔊 עברית</button></div>${s.body}</div></div>`;deck.append(el);s.el=el});
function play(file){audio.pause();audio.src='audio/'+file+'.mp3';audio.play().catch(()=>{})}
function voice(i){play(S[i].a)}
function playClip(file){play(file)}
function heSummary(btn,file){const box=btn.closest('.stage').querySelector('.summary');box.classList.toggle('show');play(file)}
function reveal(el){el.classList.add('show');const m=el.dataset.mark;if(m)el.closest('.slide').querySelectorAll('.mark.'+m).forEach(x=>x.classList.add('lit'))}
function one(root){const el=root.querySelector('.answer:not(.show)');if(el)reveal(el)}
function allAnswers(root){root.querySelectorAll('.answer').forEach(reveal)}
function useBackup(){document.querySelector('#videoBox').innerHTML='<video controls autoplay preload="metadata"><source src="videos/weifang-kite-festival-oQF78h1MT88.mp4" type="video/mp4"></video>'}
let n=-1,timerId,total=0,rest=0;
function paint(){timer.textContent=total?Math.floor(rest/60)+':'+String(rest%60).padStart(2,'0'):'—';timer.style.color=rest<=10&&rest?'var(--red)':'var(--navy)'}
function go(i){i=Math.max(0,Math.min(S.length-1,i));audio.pause();if(n>=0)S[n].el.classList.remove('on');n=i;S[n].el.classList.add('on');count.textContent=`${n+1} / ${S.length}`;progress.style.width=(n+1)/S.length*100+'%';clearInterval(timerId);total=rest=S[n].seconds;paint();timerId=setInterval(()=>{if(rest>0){rest--;paint()}},1000)}
prev.onclick=()=>go(n-1);next.onclick=()=>go(n+1);full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();timer.onclick=()=>{rest=rest?0:total;paint()};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;const rev=S[n].el.querySelector('.rev');if((e.key===' '||e.key==='a'||e.key==='A')&&rev&&rev.querySelector('.answer:not(.show)')){one(rev);e.preventDefault();return}if(['ArrowRight','PageDown',' '].includes(e.key)){go(n+1);e.preventDefault()}if(['ArrowLeft','PageUp'].includes(e.key)){go(n-1);e.preventDefault()}if(e.key==='t'||e.key==='T')timer.click();if(e.key==='f'||e.key==='F')full.click()});
if(!navigator.onLine)useBackup();go(0);
</script>
</body></html>
